name: Format Wiki Once

on:
  push:
    branches:
      - fix/wiki-prettier

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: fix/wiki-prettier

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format Wiki Markdown
        run: npx prettier --write 'wiki/**/*.md'

      - name: Commit formatted Wiki and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/format-wiki-once.yml
          git add wiki
          if git diff --cached --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git commit -m "docs: format wiki sources with Prettier"
          git push origin HEAD:fix/wiki-prettier
