services:
  ha-chatgpt-gateway:
    build: .
    container_name: ha-chatgpt-gateway
    restart: unless-stopped
    ports:
      - '${PORT:-8787}:${PORT:-8787}'
    env_file:
      - .env
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
