services:
  ha-chatgpt-gateway:
    image: ghcr.io/aferende/ha-chatgpt-gateway:latest
    container_name: ha-chatgpt-gateway
    restart: unless-stopped
    ports:
      - '${PORT:-8787}:${PORT:-8787}'
    env_file:
      - .env
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
